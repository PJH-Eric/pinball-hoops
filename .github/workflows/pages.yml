# 把 public/ 佈署到 GitHub Pages，並在建置時注入 GAME_SERVER_URL
name: 佈署前端到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game_server_url:
        description: '遊戲伺服器網址（留空就用 repo Variable GAME_SERVER_URL，再不然用下面的預設值）'
        required: false
        type: string

env:
  # 實際採用的優先序：手動執行時填的 inputs → repo Variable GAME_SERVER_URL → 這個預設值
  DEFAULT_GAME_SERVER_URL: https://pinball-hoops.onrender.com

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 跑測試
        run: npm run verify
      - name: 注入伺服器網址
        env:
          GAME_SERVER_URL: ${{ inputs.game_server_url || vars.GAME_SERVER_URL || env.DEFAULT_GAME_SERVER_URL }}
        run: node scripts/inject-server-url.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
